<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecté</title>
<style>
 body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6f4;color:#1d2421;text-align:center}
 .w{max-width:420px;margin:0 auto;padding:40px 16px}
 .ok{font-size:64px} h1{color:#126B57;font-size:24px;margin:8px 0}
 .c{background:#fff;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);font-size:15px;line-height:1.7}
 a{display:inline-block;margin-top:16px;color:#126B57;font-weight:700}
</style></head>
<body><div class="w">
 <div class="ok">✅</div>
 <h1>Code validé !</h1>
 <p>Votre connexion Internet est active.</p>
 <div class="c">
   Code : <b>$(username)</b><br>
   Temps restant : <b>$(if session-time-left)$(session-time-left)$(else)illimité$(endif)</b><br>
   Adresse IP : $(ip)
 </div>
 <a href="$(link-status)">Voir mon temps restant / me déconnecter</a>
</div></body></html>

<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
$(if refresh-timeout)<meta http-equiv="refresh" content="$(refresh-timeout-secs)">$(endif)
<title>Mon compte Wi-Fi</title>
<style>
 body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f6f4;color:#1d2421}
 .w{max-width:420px;margin:0 auto;padding:24px 16px}
 h1{color:#126B57;font-size:22px;text-align:center}
 table{width:100%;background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
 td{padding:9px 6px;border-bottom:1px solid #eef1ef} td:last-child{text-align:right;font-weight:700}
 button{width:100%;margin-top:16px;background:#9b1c1c;color:#fff;border:0;font-size:17px;font-weight:700;padding:14px;border-radius:12px}
</style></head>
<body><div class="w">
 <h1>Bonjour $(username)</h1>
 <table>
  <tr><td>Temps restant</td><td>$(if session-time-left)$(session-time-left)$(else)—$(endif)</td></tr>
  <tr><td>Connecté depuis</td><td>$(uptime)</td></tr>
  <tr><td>Données reçues</td><td>$(bytes-out-nice)</td></tr>
  <tr><td>Données envoyées</td><td>$(bytes-in-nice)</td></tr>
 </table>
 <form action="$(link-logout)" name="logout"><input type="hidden" name="erase-cookie" value="on"><button type="submit">Me déconnecter</button></form>
</div></body></html>
